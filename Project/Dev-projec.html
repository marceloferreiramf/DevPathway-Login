<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="Dev.js" defer></script>
    <link rel="stylesheet" href="Dev-projet.css">
    <title>DevPathway | Login</title>
</head>
<body>
    <div class="login-page">
        <div class="login-header">
            <h2>Entrar</h2>
            <p>Entre na sua jornada rumo à vaga.</p>
        </div>
        <div class="login-card">
            <form id="login-form">
                <input type="text" id="username" placeholder="Usuário" required>
                <input type="password" placeholder="Senha" required>
                <span class="forgot-pass">Esqueceu a senha?</span>
                
                <button type="submit" class="btn-signin">Entrar</button>
            </form>

            <div class="social-login">
                <button class="btn-social google-btn">
                    <img src="dev.img/google-logo.jpg" alt="Logo Google" class="social-icon">
                    Continuar com o Google
                </button>
                <button class="btn-social linkedin-btn">
                    <img src="dev.img/linkedin-logo.jpg" alt="Logo LinkedIn" class="social-icon">
                    Continuar com o LinkedIn
                </button>
            </div>
        </div>
    </div>
</body>
</html>
